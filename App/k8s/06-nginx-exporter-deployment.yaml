apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: php-nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args:
            - -nginx.scrape-uri=http://nginx.php-nginx-demo.svc.cluster.local/nginx_status
          ports:
            - name: metrics
              containerPort: 9113
