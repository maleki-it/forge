apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: php-nginx-demo
data:
  default.conf: |
    # http context (conf.d is included from nginx.conf) — log_format must be here, not inside server {}
    log_format prometheus '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" $request_time $upstream_response_time';

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        # Must match nginx-log-exporter format in 09-nginx-log-exporter-configmap.yaml
        access_log /var/log/nginx/access.log prometheus;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location /nginx_status {
            stub_status;
            access_log off;
            allow all;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

            # Demo setting: trust all proxy ranges.
            # In production, set only your LB/proxy CIDRs.
            set_real_ip_from 0.0.0.0/0;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            fastcgi_param REMOTE_ADDR $realip_remote_addr;
        }
    }
