# http context when included from conf.d — log_format must not be inside server {}
log_format prometheus '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time $upstream_response_time';

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Must stay in sync with k8s/03-nginx-configmap.yaml and log-exporter format
    access_log /var/log/nginx/access.log prometheus;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

        # For demo only, trust all upstream proxies.
        # In production, replace with your LB CIDR.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Pass resolved client IP to PHP as REMOTE_ADDR.
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
    }
}
